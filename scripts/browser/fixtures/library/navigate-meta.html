<!doctype html>
<!-- An HTML Tome that sends its own frame to another site with a meta refresh, no script at all. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=__ELSEWHERE__/navigate/meta?leak=x" />
    <title>Navigate by meta refresh</title>
  </head>
  <body></body>
</html>
