title: 'Party Member Needed: '
body:
  - type: markdown
    attributes:
      value: >-
        A call for someone with a setup the maintainers don't have. Name that setup in the title, then keep to one setup per
        call, so answers stay comparable.
  - type: textarea
    id: setup
    attributes:
      label: The setup we need
      description: The machine, OS, network and accounts this needs, and anything it must not be, such as a machine already in use.
      placeholder: One Windows 11 PC signed in to a domain account, with Node 22 or newer and Claude Code signed in.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What to try
      description: Numbered steps a stranger could follow, linking the guide for each. Say what a pass looks like.
      placeholder: |
        1. Follow [Getting started](https://github.com/crystal-bridge/crystal-bridge/blob/main/docs/GETTING-STARTED.md).
        2. ...

        It passes when ...
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: What it costs
      description: Roughly how long it takes, what it spends, what it changes on the machine, and how to undo it.
      placeholder: About 30 minutes and a few turns of plan usage. It adds a user service; `leave` removes it.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence to collect
      description: Keep these and add what this call needs.
      value: |
        - Crystal Bridge release, from the Castle or `GET /api/health`
        - OS and version, Node version, and `claude --version`
        - Pass or fail for each step, with the exact error text for a fail
        - The log lines around a fail ([where the logs are](https://github.com/crystal-bridge/crystal-bridge/blob/main/docs/TROUBLESHOOTING.md))
        - A screenshot, if what went wrong is on screen
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: How to answer
      description: Keep this so every answer reads the same.
      value: |
        **To claim this,** reply here saying so, so two people don't test the same thing.

        **To report,** reply with:

        ```text
        Setup:
        Release:
        Steps passed:
        Steps failed:
        Anything surprising:
        ```

        **A bug** gets its own [Issue](https://github.com/crystal-bridge/crystal-bridge/issues/new?template=bug.yml), linked from your reply. A passing report is just as useful as a failing one.

        **Before posting, remove** tokens, join codes, host names, IP addresses, email addresses, home paths and prompt text. Never post a token, even an old one: revoke it instead.
    validations:
      required: true
