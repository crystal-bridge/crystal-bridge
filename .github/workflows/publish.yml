# Each merge to main becomes a release (docs/OPERATIONS.md, Publishing): a full one when a release PR raised the package
# version, else an edge build for hubs that follow main. This only tags the merge and has Release build that tag, so
# every package is attested by the release workflow at its own tag, which is what a Kingdom checks.
name: Publish

on:
  push:
    branches: [main]
    # A change to the guides alone ships nothing new.
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To push the tag, and to start Release on it: a tag pushed with this token starts no workflow by itself.
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Next release
        id: next
        run: node scripts/next-release.mjs >> "$GITHUB_OUTPUT"
      - name: Tag this merge
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Build and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
