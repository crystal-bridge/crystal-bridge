# The same checks as the git hooks, plus the web build and a secret scan, on every PR and on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Web build
        run: pnpm --filter @crystal-bridge/web build
      - name: Kingdom package installs and runs outside the workspace
        run: bash scripts/check-kingdom-package.sh
      - name: Repo scrub (model names, home paths, emails)
        run: pnpm checks
      - name: Third-party notices are current
        run: pnpm notices:check
      - name: Secret scan (gitleaks, whole history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION
          tarball=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tarball\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
