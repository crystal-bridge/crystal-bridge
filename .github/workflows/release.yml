# A `v*` tag builds the Kingdom and hub packages and publishes their tarballs to a GitHub Release, with build provenance a machine
# can verify before running it, and puts full releases and pre-releases on npm too. Publish dispatches it on the tag it
# gives each merge to main; a tag pushed by hand starts it too.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Any tag would otherwise publish with valid provenance, so one has to be on main and pass what a pull request passes.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: This run is on a release tag
        run: '[[ $GITHUB_REF == refs/tags/v* ]]'
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Tests
        run: pnpm test

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A full release is what a release PR set. An edge build is the commit as merged, under the version Publish gave it.
      - name: Stamp an edge build's version
        if: ${{ contains(github.ref_name, '-edge.') }}
        run: |
          [[ $GITHUB_REF_NAME == v*-edge.* ]]
          (cd apps/crystal && npm pkg set version="${GITHUB_REF_NAME#v}")
          (cd apps/airship && npm pkg set version="${GITHUB_REF_NAME#v}")
      - name: The tag matches the package version
        run: test "v$(node -p "require('./apps/crystal/package.json').version")" = "$GITHUB_REF_NAME"
      - name: The hub carries the same version
        run: test "v$(node -p "require('./apps/airship/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Kingdom package installs and runs
        run: bash scripts/check-kingdom-package.sh
      - name: Hub package installs and runs
        run: bash scripts/check-hub-package.sh
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pnpm --filter @crystal-bridge/kingdom pack --pack-destination "$RUNNER_TEMP/release"
          pnpm --filter @crystal-bridge/airship pack --pack-destination "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: ${{ runner.temp }}/release/*.tgz
      # In the shape of GitHub's attestations API, so a Kingdom reads it the same way without that API's rate limit.
      - name: Keep the attestations in the release
        env:
          BUNDLES: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version=${GITHUB_REF_NAME#v}
          out=$RUNNER_TEMP/release/crystal-bridge-attestations-$version.json
          jq -s '{attestations: map({bundle: .})}' "$BUNDLES" > "$out"
          jq -e '.attestations | length > 0' "$out"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ $GITHUB_REF_NAME == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --generate-notes --verify-tag $prerelease

  # The same attested tarballs on npm, by trusted publishing: npm trusts this workflow's OIDC token, so there is no npm
  # token to keep, and it adds its own provenance. Full releases and pre-releases only: edge builds are tagged on every
  # merge to main and stay on GitHub Releases, like the image. A pre-release goes under `next`, so `latest` only ever
  # names a full release. A version already on npm is skipped, so "Re-run failed jobs" after a partial failure finishes
  # the rest ("Re-run all jobs" runs `release` again, whose `gh release create` fails on the existing release).
  # npm's trusted publisher checks only the repository, this file's name and the environment, never the ref, so the
  # `npm` environment, with the owner as its required reviewer, is what keeps any other run of this file from publishing.
  npm:
    if: ${{ !contains(github.ref_name, '-edge.') }}
    needs: release
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships npm 10. Pinned exactly, like the actions.
      - name: npm for trusted publishing
        run: |
          npm install -g npm@11.21.3
          npm --version
      - name: Download the release's tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm"
          cd "$RUNNER_TEMP/npm"
          gh release download "$GITHUB_REF_NAME" --pattern 'crystal-bridge-*.tgz' --repo "$GITHUB_REPOSITORY"
          ls -l
      - name: Check and publish each package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/npm"
          version=${GITHUB_REF_NAME#v}
          tag=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then tag=(--tag next); fi
          # Both tarballs pass before either is published: built by this workflow, at this tag.
          for name in kingdom airship; do
            file=crystal-bridge-$name-$version.tgz
            test -f "$file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF"
          done
          for name in kingdom airship; do
            file=crystal-bridge-$name-$version.tgz
            pkg=@crystal-bridge/$name
            if [[ -n $(npm view "$pkg@$version" version 2>/dev/null) ]]; then
              echo "::notice::$pkg@$version is already on npm, so it is skipped"
              continue
            fi
            npm publish "./$file" --access public "${tag[@]}"
          done

  # Only the ten newest edge builds stay: a hub following main wants the latest, and the Releases page stays readable.
  # A Kingdom keeps the release it runs, and the one before it, on disk.
  prune:
    needs: release
    if: ${{ contains(github.ref_name, '-edge.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete older edge releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | test(\"^v[0-9]+\\\\.[0-9]+\\\\.[0-9]+-edge\\\\.[0-9]+$\"))] | sort_by(.createdAt) | reverse | .[$KEEP:][] | .tagName" |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done

  # The hub image for both common architectures, for full releases only: `latest` never names a pre-release, and an edge
  # build would spend most of an hour on an image nobody pulls.
  image:
    if: ${{ !contains(github.ref_name, '-edge.') }}
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/crystal-bridge/airship
          tags=$image:${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF_NAME == *-* ]] || tags=$tags,$image:latest
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
