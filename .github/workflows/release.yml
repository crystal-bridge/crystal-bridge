# A `v*` tag builds the Kingdom and hub packages and publishes their tarballs to a GitHub Release, with build provenance a machine
# can verify before running it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the package version
        run: test "v$(node -p "require('./apps/crystal/package.json').version")" = "$GITHUB_REF_NAME"
      - name: The hub carries the same version
        run: test "v$(node -p "require('./apps/airship/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Kingdom package installs and runs
        run: bash scripts/check-kingdom-package.sh
      - name: Hub package installs and runs
        run: bash scripts/check-hub-package.sh
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pnpm --filter @crystal-bridge/kingdom pack --pack-destination "$RUNNER_TEMP/release"
          pnpm --filter @crystal-bridge/airship pack --pack-destination "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/release/*.tgz
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ $GITHUB_REF_NAME == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/*.tgz --generate-notes --verify-tag $prerelease

  # The hub image for both common architectures. `latest` is only for full releases, never a pre-release.
  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/crystal-bridge/airship
          tags=$image:${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF_NAME == *-* ]] || tags=$tags,$image:latest
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
