# A `v*` tag builds the Kingdom and hub packages and publishes their tarballs to a GitHub Release, with build provenance a machine
# can verify before running it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the package version
        run: test "v$(node -p "require('./apps/crystal/package.json').version")" = "$GITHUB_REF_NAME"
      - name: The hub carries the same version
        run: test "v$(node -p "require('./apps/airship/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Kingdom package installs and runs
        run: bash scripts/check-kingdom-package.sh
      - name: Hub package installs and runs
        run: bash scripts/check-hub-package.sh
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          pnpm --filter @crystal-bridge/kingdom pack --pack-destination "$RUNNER_TEMP/release"
          pnpm --filter @crystal-bridge/airship pack --pack-destination "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: ${{ runner.temp }}/release/*.tgz
      # In the shape of GitHub's attestations API, so a Kingdom reads it the same way without that API's rate limit.
      - name: Keep the attestations in the release
        env:
          BUNDLES: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version=${GITHUB_REF_NAME#v}
          out=$RUNNER_TEMP/release/crystal-bridge-attestations-$version.json
          jq -s '{attestations: map({bundle: .})}' "$BUNDLES" > "$out"
          jq -e '.attestations | length > 0' "$out"
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=$([[ $GITHUB_REF_NAME == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --generate-notes --verify-tag $prerelease

  # The hub image for both common architectures. `latest` is only for full releases, never a pre-release.
  image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        run: |
          image=ghcr.io/crystal-bridge/airship
          tags=$image:${GITHUB_REF_NAME#v}
          [[ $GITHUB_REF_NAME == *-* ]] || tags=$tags,$image:latest
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
