# The docs site is its own workspace with its own lockfile, not a package of the repo's. Hub and Kingdom installs ship
# the root lockfile, and the Docker build and Kingdom deploys leave docs/ out, so nothing here can reach them.
packages:
  - '.'

allowBuilds:
  esbuild: false # its postinstall only re-checks the platform binary, which ships as an optional dep

# VitePress 1.6 asks for Vite 5, whose dev server has known advisories fixed only in 6.4.4 and later. It builds and
# serves the site on 6; drop this once VitePress allows it.
overrides:
  vite: ^6.4.4
